<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Área | LAIA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" onerror="console.error('[LAIA] Falha ao carregar a biblioteca SheetJS.')"></script>
</head>

<body class="pagina-area">
    <header class="area-header">
        <a class="botao-voltar" href="index.html">&larr; Voltar para Áreas</a>
        <p class="eyebrow">Levantamento de Aspectos e Impactos Ambientais</p>
        <h1 id="nome-area">Carregando área...</h1>
    </header>

    <main class="area-main">
        <section class="filtros" aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros">Filtrar atividades</h2>
            <div class="filtros-grid">
                <label>Atividade<select id="filtro-atividade"><option value="">Todas</option></select></label>
                <label>Aspecto<select id="filtro-aspecto"><option value="">Todos</option></select></label>
                <label>Impacto<select id="filtro-impacto"><option value="">Todos</option></select></label>
                <label>Significância<select id="filtro-significancia"><option value="">Todas</option></select></label>
                <label>Organizar atividades<select id="ordenacao-atividades">
                    <option value="az">A-Z</option>
                    <option value="za">Z-A</option>
                </select></label>
            </div>
        </section>

        <p id="status-area" class="status-area" aria-live="polite"></p>
        <section id="atividades-container" class="atividades-container" aria-live="polite"></section>
    </main>

    <footer class="qr-footer">
        <h2>Compartilhar página</h2>
        <div id="qrcode" class="qrcode" aria-label="QR Code desta página"></div>
        <button id="baixar-qrcode" class="botao-download" type="button">Baixar QR Code</button>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="excelService.js"></script>
    <script src="area.js"></script>
    <script src="qrCode.js"></script>
</body>

</html>
